<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Resgate: Operação A.N.C.O.R.A.</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* CSS UNIFICADO: Interface, Loja, Criador e Mobile */
        body { margin: 0; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Menus e Telas */
        .overlay-screen { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hidden { display: none !important; }

        /* Botões Estilo App */
        .menu-btn { background: #222; border: 2px solid #00ff00; color: #00ff00; padding: 15px 30px; margin: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 200px; text-align: center; }
        .menu-btn:active { transform: scale(0.95); background: #00ff00; color: #000; }

        /* Grid do Jogo */
        #stage { width: 400px; height: 400px; background: #111; border: 4px solid #333; position: relative; }
        .tile { position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.1s; }

        /* Estilos específicos da Loja e Criador (já integrados conforme as aulas anteriores) */
        .upgrade-card, .package-card { background: #1a1a1a; border: 1px solid #444; padding: 10px; border-radius: 8px; margin: 5px; text-align: center; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="main-menu" class="overlay-screen">
            <h1 style="color: #00ff00; letter-spacing: 5px;">O RESGATE</h1>
            <button class="menu-btn" onclick="startGame()">NOVO JOGO</button>
            <button class="menu-btn" onclick="toggleShop()">🛒 LOJA & UPGRADES</button>
            <button class="menu-btn" onclick="toggleCreator()">🧪 CRIAR HERÓI (R$)</button>
            <button class="menu-btn" onclick="toggleRanking()">🏆 RANKING</button>
            <button class="menu-btn" onclick="toggleCredits()">CRÉDITOS</button>
        </div>

        <div id="shop-screen" class="overlay-screen hidden">
            <h2>MERCADO TÁTICO</h2>
            <div id="money-display">Sucatas: ⚙️ <span id="current-scraps">0</span></div>
            <div class="upgrade-grid" style="display: grid; grid-template-columns: 1fr 1fr;">
                </div>
            <button class="menu-btn" onclick="toggleShop()">VOLTAR</button>
        </div>

        <div id="game-view" class="hidden">
            <div id="hud">Fase: <span id="lvl-num">1</span> | Vida: <span id="hp-num">100</span></div>
            <div id="stage"></div>
            <div id="controls-mobile">
                </div>
        </div>
    </div>

    <script>
        /* LÓGICA MESTRE */
        let gameState = {
            faseAtual: 1,
            sucatas: 0,
            heroisDesbloqueados: ['leo', 'sarah'],
            civisSalvos: 0
        };

        // 1. Gerador Procedural (Criação automática das 80 fases)
        function generateLevel(n) {
            console.log("Gerando fase " + n);
            const stage = document.getElementById('stage');
            stage.innerHTML = '';
            // Lógica de sorteio de obstáculos baseada no nível n...
            // (Insira aqui a lógica de Math.random() que criamos)
        }

        // 2. Sistema de Monetização
        function processPayment(item, price) {
            // Simulação de checkout real
            if(confirm(Confirmar compra de ${item} por R$ ${price}?)) {
                alert("Pagamento processado via Provedor Mobile!");
                return true;
            }
            return false;
        }

        // 3. Sistema de Save (LocalStorage)
        function saveProgress() {
            localStorage.setItem('resgate_master_save', JSON.stringify(gameState));
        }

        // 4. Inicialização do App
        window.onload = () => {
            const saved = localStorage.getItem('resgate_master_save');
            if(saved) gameState = JSON.parse(saved);
            document.getElementById('current-scraps').innerText = gameState.sucatas;
        };

        /* Funções de Navegação */
        function toggleShop() { 
            document.getElementById('main-menu').classList.toggle('hidden');
            document.getElementById('shop-screen').classList.toggle('hidden');
            // Renderiza pacotes de sucatas e heróis para compra...
        }

        function startGame() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            generateLevel(gameState.faseAtual);
        }

        // Registro de Service Worker para PWA (Instalação Mobile)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
